name: Rebuild prerendered pages

# Fires when Sanity Studio's publish button sends a webhook (configured in
# Sanity's dashboard to POST a repository_dispatch event to this repo - see
# the setup notes in build.js's commit / project docs), or manually via the
# "Run workflow" button in the Actions tab. Either way it just re-runs
# build.js and commits whatever changed.
on:
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run build.js
        run: node build.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html archive/
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Rebuild: sync prerendered pages with Sanity content"
            git push
          fi
